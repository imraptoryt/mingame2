<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Safe</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap');

* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  min-height:100vh;
  background:
    radial-gradient(800px 600px at 50% 0%, #1a2640 0%, transparent 65%),
    radial-gradient(ellipse at center, #0d121d 0%, #06080d 80%);
  font-family:'Inter',sans-serif; color:#dbe2ee;
  display:flex; align-items:center; justify-content:center; padding:20px;
  overflow:hidden;
}

.stage { position:relative; width:min(94vw, 360px); }

/* ===== SAFE OUTER SHELL ===== */
.safe {
  position:relative; width:100%; padding:42px 22px 32px;
  border-radius:18px;
  background:linear-gradient(165deg, #2a3346 0%, #1a2236 50%, #0d1220 100%);
  box-shadow:
    inset 0 0 0 1px rgba(150,180,220,0.18),
    inset 0 0 0 4px rgba(8,12,20,0.9),
    inset 0 0 0 5px rgba(80,100,140,0.28),
    inset 0 0 60px rgba(0,0,0,0.55),
    0 30px 70px rgba(0,0,0,0.7),
    0 0 0 1px rgba(0,0,0,0.5);
  transition: box-shadow 0.8s;
}
.safe::before {
  content:''; position:absolute; inset:0; border-radius:18px; pointer-events:none;
  background:linear-gradient(110deg, transparent 30%, rgba(150,180,220,0.04) 50%, transparent 70%);
}
.safe.unlocked {
  box-shadow:
    inset 0 0 0 1px rgba(245,166,35,0.3),
    inset 0 0 0 4px rgba(8,12,20,0.9),
    inset 0 0 0 5px rgba(245,166,35,0.18),
    inset 0 0 70px rgba(0,0,0,0.55),
    0 30px 70px rgba(0,0,0,0.7),
    0 0 60px rgba(245,166,35,0.18);
}

/* corner bolts */
.bolt {
  position:absolute; width:16px; height:16px; border-radius:50%;
  background:radial-gradient(circle at 35% 32%, #7a8aa3 5%, #3a4660 50%, #15203a 90%);
  box-shadow:
    inset 0 -1px 2px rgba(0,0,0,0.7),
    inset 0 1px 1px rgba(255,255,255,0.15),
    0 1px 2px rgba(0,0,0,0.4);
  z-index:5;
  transition: transform 0.55s cubic-bezier(0.45,0,0.4,1.3), box-shadow 0.5s;
  transition-delay:0s;
}
.bolt::before {
  content:''; position:absolute; inset:3px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #5a6580 5%, #1a2030 75%);
  box-shadow:inset 0 -1px 1px rgba(0,0,0,0.5);
}
.bolt::after {
  content:''; position:absolute; top:50%; left:24%; width:52%; height:1.5px;
  background:rgba(0,0,0,0.65); transform:translateY(-50%); border-radius:1px;
}
.bolt.tl{top:9px;left:9px;} .bolt.tr{top:9px;right:9px;}
.bolt.bl{bottom:9px;left:9px;} .bolt.br{bottom:9px;right:9px;}

.safe.unlocking .bolt.tl { transition-delay:0s; }
.safe.unlocking .bolt.tr { transition-delay:0.1s; }
.safe.unlocking .bolt.br { transition-delay:0.2s; }
.safe.unlocking .bolt.bl { transition-delay:0.3s; }
.safe.unlocking .bolt {
  transform: rotate(90deg) scale(1.15);
  box-shadow:
    inset 0 -1px 2px rgba(0,0,0,0.7),
    inset 0 1px 1px rgba(255,255,255,0.15),
    0 0 16px rgba(245,166,35,0.7),
    0 0 4px rgba(245,166,35,0.9);
}

/* brand plate */
.brand {
  position:absolute; top:14px; left:50%; transform:translateX(-50%); z-index:6;
  padding:3px 12px; border-radius:3px;
  background:linear-gradient(180deg, #2a3346 0%, #131a2b 100%);
  box-shadow:
    inset 0 0 0 1px rgba(150,180,220,0.18),
    inset 0 1px 0 rgba(255,255,255,0.05),
    0 1px 2px rgba(0,0,0,0.5);
  font-family:'JetBrains Mono',monospace;
  font-size:8px; letter-spacing:3px; color:#94a3b8; text-transform:uppercase;
  display:flex; align-items:center; gap:8px;
}
.brand::before {
  content:''; width:5px; height:5px; border-radius:50%;
  background:#f5a623; box-shadow:0 0 6px rgba(245,166,35,0.7);
  animation:bp 1.6s infinite; transition: background 0.4s, box-shadow 0.4s, animation 0.3s;
}
.safe.unlocked .brand::before { background:#4ade80; box-shadow:0 0 10px rgba(74,222,128,0.85); animation-duration:0.6s; }
@keyframes bp { 0%,100%{opacity:1;} 50%{opacity:0.35;} }

/* ===== INTERIOR (the chamber, behind the door) ===== */
.interior {
  position:relative;
  border-radius:10px;
  background:
    radial-gradient(circle at 50% 50%, #0c1424 0%, #03070f 80%);
  box-shadow:
    inset 0 0 0 1px rgba(0,0,0,0.7),
    inset 0 0 50px rgba(0,0,0,0.95);
  min-height:380px;
  overflow:hidden;
  display:flex; align-items:center; justify-content:center;
  z-index:1;
}
.interior::before {
  content:''; position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(circle at 50% 60%, rgba(245,166,35,0) 0%, rgba(245,166,35,0) 100%);
  transition: background 1.2s 0.4s;
}
.safe.unlocked .interior::before {
  background:radial-gradient(circle at 50% 60%, rgba(245,166,35,0.22) 0%, rgba(245,166,35,0) 70%);
}

/* ===== DOOR (with keypad on it) ===== */
.door {
  position:absolute;
  inset:32px 22px 22px;
  border-radius:10px;
  background:linear-gradient(180deg, #1f293f 0%, #131a2b 100%);
  box-shadow:
    inset 0 0 0 1px rgba(150,180,220,0.14),
    inset 0 1px 0 rgba(255,255,255,0.04),
    0 4px 14px rgba(0,0,0,0.4);
  padding:22px 20px 16px;
  z-index:5;
  transform-origin:0% 50%;
  transform: perspective(2000px) rotateY(0deg);
  transition: transform 1.8s cubic-bezier(0.66, 0, 0.28, 1), filter 1s;
  display:flex; flex-direction:column; align-items:center;
}
.door::after {
  content:''; position:absolute; inset:0; border-radius:10px; pointer-events:none;
  background:linear-gradient(110deg, transparent 30%, rgba(150,180,220,0.05) 50%, transparent 70%);
}
.door.open {
  transform: perspective(2000px) rotateY(-118deg);
  filter: drop-shadow(-26px 14px 36px rgba(0,0,0,0.85));
  pointer-events:none;
}
.door.shake { animation: shake 0.4s; }
@keyframes shake { 0%,100%{transform:perspective(2000px) translateX(0) rotateY(0);} 20%{transform:perspective(2000px) translateX(-7px);} 40%{transform:perspective(2000px) translateX(7px);} 60%{transform:perspective(2000px) translateX(-4px);} 80%{transform:perspective(2000px) translateX(4px);} }

/* door inner hinge line (left edge subtle line) */
.door::before {
  content:''; position:absolute; left:0; top:14%; bottom:14%; width:2px;
  background:linear-gradient(180deg, transparent, rgba(255,255,255,0.08) 50%, transparent);
}

/* ===== KEYPAD CONTENT ===== */
.label {
  font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:3px;
  color:#566177; text-transform:uppercase; margin-bottom:12px;
}

.display {
  width:100%; border-radius:9px; padding:13px;
  background:#050810;
  box-shadow: inset 0 0 22px rgba(0,0,0,0.85), inset 0 0 0 1px rgba(150,180,220,0.08);
  display:flex; justify-content:center; gap:14px; margin-bottom:16px;
}
.dot {
  width:13px; height:13px; border-radius:50%;
  background:rgba(150,180,220,0.13);
  box-shadow: inset 0 1px 1px rgba(0,0,0,0.5);
  transition: all 0.18s;
}
.dot.on { background:#f5a623; box-shadow:0 0 12px rgba(245,166,35,0.6); transform:scale(1.05); }
.dot.err { background:#f87171; box-shadow:0 0 12px rgba(248,113,113,0.7); animation:dotErr 0.4s; }
.dot.good { background:#4ade80; box-shadow:0 0 16px rgba(74,222,128,0.95); animation:dotGood 0.5s cubic-bezier(0.3,1.5,0.5,1); }
@keyframes dotErr { 0%,100%{transform:scale(1);} 50%{transform:scale(1.2);} }
@keyframes dotGood { 0%{transform:scale(0.6);} 60%{transform:scale(1.3);} 100%{transform:scale(1.05);} }
.dot.next { animation: nextPulse 1.4s infinite; }
@keyframes nextPulse {
  0%,100% { transform:scale(1); background:rgba(150,180,220,0.13); }
  50% { transform:scale(1.15); background:rgba(245,166,35,0.25); box-shadow: 0 0 8px rgba(245,166,35,0.3), inset 0 1px 1px rgba(0,0,0,0.5); }
}

.keypad { width:100%; display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-bottom:12px; }
.key {
  aspect-ratio:1.25/1; border-radius:9px; border:1px solid rgba(150,180,220,0.13);
  background:linear-gradient(180deg, #2c3650 0%, #1b2438 100%);
  color:#dbe2ee;
  font-family:'Inter',sans-serif; font-weight:600; font-size:18px;
  cursor:pointer; transition: all 0.08s;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.07), 0 2px 4px rgba(0,0,0,0.35);
  user-select:none; -webkit-user-select:none;
}
.key:hover { background:linear-gradient(180deg, #36436a 0%, #20304c 100%); }
.key:active, .key.pressed {
  transform: translateY(1px);
  background:linear-gradient(180deg, #1b2438 0%, #2c3650 100%);
  box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
}
.key.act { font-size:14px; font-weight:500; }
.key.clear { color:#f87171; }
.key.back { color:#94a3b8; font-size:15px; }

.status {
  font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:1.5px;
  color:#566177; text-transform:uppercase; text-align:center; min-height:14px;
  transition: color 0.4s;
}
.status.bad { color:#f87171; } .status.good { color:#4ade80; } .status.work { color:#f5a623; }

/* ===== NOTE inside interior, revealed after door opens ===== */
.note-wrap {
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  opacity:0; pointer-events:none;
  transform: translateY(40px) scale(0.5);
  transition: opacity 0.6s, transform 0.8s cubic-bezier(0.3,1.45,0.5,1);
}
.note-wrap.show { opacity:1; transform: translateY(0) scale(1); pointer-events:auto; }

.note {
  width:200px; padding:24px 18px;
  border-radius:14px;
  background:linear-gradient(165deg, #f7e9b3 0%, #e8c14b 60%, #b9871c 100%);
  text-align:center; color:#3a2606;
  display:flex; flex-direction:column; align-items:center; gap:8px;
  cursor:pointer;
  box-shadow:
    inset 0 0 0 1px rgba(255,244,200,0.5),
    0 12px 30px rgba(0,0,0,0.5),
    0 0 22px rgba(245,166,35,0.5);
  transition: transform 0.2s;
  animation: noteShow 1.6s infinite 0.6s;
}
.note:hover { transform:scale(1.05); animation:none; }
@keyframes noteShow {
  0%,100% { box-shadow: inset 0 0 0 1px rgba(255,244,200,0.55), 0 12px 30px rgba(0,0,0,0.5), 0 0 22px rgba(245,166,35,0.6); }
  50%     { box-shadow: inset 0 0 0 1px rgba(255,255,230,0.95), 0 12px 30px rgba(0,0,0,0.5), 0 0 52px rgba(245,166,35,1.1); }
}
.note .icon { width:32px; height:32px; opacity:0.8; }
.note .icon svg { width:100%; height:100%; display:block; }
.note .title { font-weight:700; font-size:14px; letter-spacing:3px; text-transform:uppercase; }
.note .sub { font-weight:500; font-size:10px; letter-spacing:2px; opacity:0.75; text-transform:uppercase; }

/* sparks */
@keyframes sparkle { 0%{transform:scale(0) rotate(0);opacity:1;} 100%{transform:scale(2) rotate(180deg);opacity:0;} }
.spark { position:absolute; width:10px; height:10px; border-radius:50%; pointer-events:none; z-index:50;
  background:radial-gradient(circle, #fff, #f5a623); animation:sparkle 0.9s ease-out forwards;
  box-shadow:0 0 6px rgba(245,166,35,0.8); }

/* flash */
.flash {
  position:absolute; inset:0; border-radius:10px; pointer-events:none;
  background:radial-gradient(circle at 50% 50%, rgba(255,240,200,0.6) 0%, transparent 60%);
  opacity:0; z-index:40;
}
.flash.fire { animation: flashAnim 0.7s ease-out forwards; }
@keyframes flashAnim {
  0% { opacity:0; transform:scale(0.4); }
  30% { opacity:1; }
  100% { opacity:0; transform:scale(1.4); }
}

/* ===== MODAL ===== */
.screen { position:fixed; inset:0; background:rgba(2,4,8,0.86); display:none; align-items:center; justify-content:center; z-index:400; backdrop-filter:blur(12px); padding:20px; }
.screen.active { display:flex; animation:fade 0.3s; }
@keyframes fade { from{opacity:0;} to{opacity:1;} }
.modal {
  width:100%; max-width:360px; border-radius:18px; position:relative;
  background:linear-gradient(170deg, #f7e9b3 0%, #e8c14b 60%, #b9871c 100%);
  padding:30px 26px 22px; text-align:center; color:#3a2606;
  box-shadow:0 25px 70px rgba(0,0,0,0.7), 0 0 50px rgba(245,166,35,0.3);
  animation:pop 0.5s cubic-bezier(0.3,1.4,0.5,1);
}
@keyframes pop { from{transform:scale(0.7) translateY(20px);opacity:0;} to{transform:scale(1) translateY(0);opacity:1;} }
.modal h2 { font-weight:700; font-size:12px; letter-spacing:3px; color:#5a3a08; text-transform:uppercase; margin-bottom:14px; }
.modal .line { font-size:14px; color:#5a3a08; margin-bottom:6px; opacity:0.85; }
.pwd { display:inline-block; font-family:'JetBrains Mono',monospace; font-weight:600; font-size:24px; letter-spacing:2px; color:#3a2606; margin-top:6px;
  padding:11px 22px; border-radius:10px; background:rgba(255,255,255,0.42); border:1px solid rgba(120,80,10,0.3); }
.modal .sig { margin-top:18px; font-size:11px; color:#7a5510; font-style:italic; }
.btn { margin-top:18px; padding:10px 24px; border:none; cursor:pointer; font-weight:600; font-size:11px;
  letter-spacing:2px; text-transform:uppercase; color:#3a2606; border-radius:9px;
  background:linear-gradient(180deg, #fff3c8, #e0ad48); box-shadow:0 5px 14px rgba(120,80,10,0.3); transition:all 0.12s; }
.btn:hover { filter:brightness(1.06); transform:translateY(-1px); } .btn:active { transform:translateY(1px); }
</style>
</head>
<body>

<div class="stage">
  <div class="safe" id="safe">
    <div class="bolt tl"></div><div class="bolt tr"></div>
    <div class="bolt bl"></div><div class="bolt br"></div>
    <div class="brand">SAFE · ZX-1985</div>

    <!-- Interior (the chamber behind the door) -->
    <div class="interior" id="interior">
      <div class="note-wrap" id="noteWrap">
        <div class="note" id="note">
          <div class="icon"><svg viewBox="0 0 64 64"><rect x="11" y="6" width="42" height="52" rx="4" fill="#3a2606"/><g stroke="#3a2606" stroke-width="2.8" stroke-linecap="round" opacity="0.4"><line x1="19" y1="18" x2="45" y2="18"/><line x1="19" y1="26" x2="45" y2="26"/><line x1="19" y1="34" x2="45" y2="34"/><line x1="19" y1="42" x2="38" y2="42"/></g></svg></div>
          <div class="title">Appuie</div>
          <div class="sub">pour le code</div>
        </div>
      </div>
      <div class="flash" id="flash"></div>
    </div>

    <!-- Door (with keypad) -->
    <div class="door" id="door">
      <div class="label">CODE · 4 CHIFFRES</div>
      <div class="display">
        <div class="dot" id="dot0"></div>
        <div class="dot" id="dot1"></div>
        <div class="dot" id="dot2"></div>
        <div class="dot" id="dot3"></div>
      </div>
      <div class="keypad">
        <button class="key" data-d="1">1</button>
        <button class="key" data-d="2">2</button>
        <button class="key" data-d="3">3</button>
        <button class="key" data-d="4">4</button>
        <button class="key" data-d="5">5</button>
        <button class="key" data-d="6">6</button>
        <button class="key" data-d="7">7</button>
        <button class="key" data-d="8">8</button>
        <button class="key" data-d="9">9</button>
        <button class="key act clear" data-a="clear">C</button>
        <button class="key" data-d="0">0</button>
        <button class="key act back" data-a="back">⌫</button>
      </div>
      <div class="status" id="status">Entre le code</div>
    </div>
  </div>
</div>

<div class="screen" id="screen">
  <div class="modal">
    <h2>Note retrouvée</h2>
    <div class="line">MDP de mon PC</div>
    <div class="pwd">ZoeLaGoat</div>
    <div class="sig">— Pour ne pas oublier ✍</div>
    <button class="btn" id="close">Fermer</button>
  </div>
</div>

<script>
let actx;
function tick(f=800,d=0.04,v=0.08,t='sine'){try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(actx.destination);o.start();g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+d);o.stop(actx.currentTime+d);}catch(e){}}

const CODE=[1,9,8,5];
const dots=[0,1,2,3].map(i=>document.getElementById('dot'+i));
const safe=document.getElementById('safe'), door=document.getElementById('door');
const noteWrap=document.getElementById('noteWrap'), note=document.getElementById('note');
const interior=document.getElementById('interior'), flash=document.getElementById('flash');
const statusEl=document.getElementById('status');
let entered=[], unlocked=false, busy=false;

function updateDots(){
  dots.forEach((d,i)=>{
    d.classList.remove('on','err','good','next');
    if(i<entered.length) d.classList.add('on');
    else if(i===entered.length && !unlocked && !busy) d.classList.add('next');
  });
}
function addDigit(n){
  if(unlocked||busy||entered.length>=4) return;
  entered.push(n); updateDots(); tick(820,0.04,0.07,'square');
  if(entered.length===4) setTimeout(validate,240);
}
function clearAll(){
  if(unlocked||busy) return;
  entered=[]; updateDots(); tick(400,0.06,0.06);
  statusEl.className='status'; statusEl.textContent='Entre le code';
}
function back(){
  if(unlocked||busy) return;
  entered.pop(); updateDots(); tick(560,0.04,0.06);
}
function validate(){
  busy=true;
  const ok=entered.every((d,i)=>d===CODE[i]);
  if(ok){
    // sequential green wave on dots
    dots.forEach((d,i)=>setTimeout(()=>{
      d.classList.remove('on','next');
      d.classList.add('good');
      tick(900+i*120,0.08,0.08,'triangle');
    }, i*70));
    statusEl.className='status good'; statusEl.textContent='Accès accordé';
    setTimeout(unlock, 600);
  } else {
    dots.forEach(d=>{d.classList.remove('on','next');d.classList.add('err');});
    statusEl.className='status bad'; statusEl.textContent='Code incorrect';
    tick(180,0.3,0.1,'sawtooth');
    door.classList.add('shake');
    setTimeout(()=>{
      door.classList.remove('shake');
      dots.forEach(d=>d.classList.remove('err'));
      entered=[]; statusEl.className='status'; statusEl.textContent='Entre le code';
      busy=false; updateDots();
    },900);
  }
}

function unlock(){
  unlocked=true;

  // STAGE 1: bolts spin with stagger
  statusEl.className='status work'; statusEl.textContent='Déverrouillage…';
  safe.classList.add('unlocking');
  [0,100,200,300].forEach((d,i)=>setTimeout(()=>tick(260+i*30,0.09,0.1,'square'), d));

  // STAGE 2: low rumble + door starts opening
  setTimeout(()=>{
    statusEl.textContent='Ouverture…';
    tick(140, 1.0, 0.13, 'sawtooth');
    setTimeout(()=>tick(110, 0.8, 0.1, 'sawtooth'), 200);
    door.classList.add('open');
    safe.classList.add('unlocked');
  }, 700);

  // STAGE 3: flash + sparks + note appears
  setTimeout(()=>{
    flash.classList.add('fire');
    setTimeout(()=>flash.classList.remove('fire'), 800);
    burstSparks();
    statusEl.textContent='Note disponible';
    noteWrap.classList.add('show');
    tick(1300,0.4,0.1,'triangle');
    setTimeout(()=>tick(1700,0.3,0.08,'triangle'), 120);
  }, 1700);

  // STAGE 4: clear status text
  setTimeout(()=>{
    statusEl.textContent='';
  }, 3500);
}

function burstSparks(){
  for(let i=0;i<22;i++){
    setTimeout(()=>{
      const s=document.createElement('div'); s.className='spark';
      s.style.left=(30+Math.random()*40)+'%';
      s.style.top=(30+Math.random()*40)+'%';
      interior.appendChild(s);
      setTimeout(()=>s.remove(),900);
    }, i*32);
  }
}

document.querySelectorAll('.key').forEach(b=>{
  b.addEventListener('click',()=>{
    if(b.dataset.d!=null) addDigit(+b.dataset.d);
    else if(b.dataset.a==='clear') clearAll();
    else if(b.dataset.a==='back') back();
  });
});
document.addEventListener('keydown',e=>{
  if(unlocked) return;
  if(e.key>='0'&&e.key<='9'){
    const k=document.querySelector(`.key[data-d="${e.key}"]`);
    if(k){k.classList.add('pressed');setTimeout(()=>k.classList.remove('pressed'),100);}
    addDigit(+e.key);
  } else if(e.key==='Backspace'){
    const k=document.querySelector('.key.back'); k.classList.add('pressed'); setTimeout(()=>k.classList.remove('pressed'),100);
    back();
  } else if(e.key==='Escape'){
    const k=document.querySelector('.key.clear'); k.classList.add('pressed'); setTimeout(()=>k.classList.remove('pressed'),100);
    clearAll();
  }
});

note.addEventListener('click',()=>{
  document.getElementById('screen').classList.add('active');
  tick(880,0.2,0.08);
});
document.getElementById('close').addEventListener('click',()=>{
  document.getElementById('screen').classList.remove('active');
});
